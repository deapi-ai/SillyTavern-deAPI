<div id="deapi_images_settings" class="deapi-images-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>deAPI Images</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="deapi_images_key">API key</label>
            <input id="deapi_images_key" class="text_pole" type="password" autocomplete="off" placeholder="sk-dp-..." />
            <small>Create one at <a href="https://app.deapi.ai/settings/api-keys" target="_blank" rel="noopener">app.deapi.ai</a>. It is stored in your SillyTavern settings.</small>

            <label for="deapi_images_model">Model</label>
            <input id="deapi_images_model" class="text_pole" type="text" list="deapi_images_models" />
            <datalist id="deapi_images_models">
                <option value="ZImageTurbo_INT8"></option>
                <option value="Flux1schnell"></option>
                <option value="Flux_2_Klein_4B_BF16"></option>
                <option value="ZAnimeDistill_8Step_INT8"></option>
            </datalist>

            <label for="deapi_images_size">Size</label>
            <select id="deapi_images_size" class="text_pole">
                <option value="512x512">512 × 512</option>
                <option value="768x768">768 × 768</option>
                <option value="1024x1024">1024 × 1024</option>
                <option value="1024x1536">1024 × 1536 (Flux)</option>
                <option value="1536x1024">1536 × 1024 (Flux)</option>
            </select>

            <label for="deapi_images_prefix">Prompt prefix</label>
            <input id="deapi_images_prefix" class="text_pole" type="text" placeholder="e.g. anime style, soft light" />

            <div class="deapi-row">
                <div id="deapi_images_test" class="menu_button">Test key</div>
                <span id="deapi_images_status"></span>
            </div>
            <small>Use <code>/deapi-image a castle at dusk</code> or the wand menu. deAPI filters NSFW prompts; a rejected prompt shows an error instead of an image.</small>
        </div>
    </div>
</div>
